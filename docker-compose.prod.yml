version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: fixtogether-mongodb-prod
    restart: always
    volumes:
      - mongodb_prod_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fixtogether
    networks:
      - fixtogether-prod-net

  # Express Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fixtogether-server-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/fixtogether
      CLIENT_URL: https://app.fixtogether.com
      ADMIN_URL: https://admin.fixtogether.com
    depends_on:
      - mongodb
    volumes:
      - server_uploads:/app/uploads
    networks:
      - fixtogether-prod-net

  # Public Client Web App
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: https://api.fixtogether.com/api/v1
        VITE_ADMIN_URL: https://admin.fixtogether.com
        VITE_SOCKET_URL: https://api.fixtogether.com
    container_name: fixtogether-client-prod
    restart: always
    depends_on:
      - server
    networks:
      - fixtogether-prod-net

  # Standalone Admin Web App
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: https://api.fixtogether.com/api/v1
        VITE_PUBLIC_CLIENT_URL: https://app.fixtogether.com
    container_name: fixtogether-admin-prod
    restart: always
    depends_on:
      - server
    networks:
      - fixtogether-prod-net

  # Nginx Gateway & Reverse Proxy
  proxy:
    image: nginx:alpine
    container_name: fixtogether-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - client
      - admin
    networks:
      - fixtogether-prod-net

volumes:
  mongodb_prod_data:
  server_uploads:

networks:
  fixtogether-prod-net:
    driver: bridge
