version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: fixtogether-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fixtogether
    networks:
      - fixtogether-net

  # Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fixtogether-server
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/fixtogether
      JWT_ACCESS_SECRET: ft_access_secret_dev_only
      JWT_REFRESH_SECRET: ft_refresh_secret_dev_only
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      AI_PROVIDER: mock
    depends_on:
      - mongodb
    volumes:
      - ./server/src:/app/src
      - server_uploads:/app/uploads
    networks:
      - fixtogether-net

  # Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fixtogether-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src
    networks:
      - fixtogether-net

volumes:
  mongodb_data:
  server_uploads:

networks:
  fixtogether-net:
    driver: bridge
